version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - netbox-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a ${REDIS_PASSWORD} ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--requirepass", "${REDIS_CACHE_PASSWORD}"]
    volumes:
      - netbox-redis-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a \"${REDIS_CACHE_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  netbox:
    image: netboxcommunity/netbox:v4.4-3.4.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Required
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      ALLOWED_HOSTS: "*"

      # DB
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}

    volumes:
      - netbox-media-files:/opt/netbox/netbox/media
      - netbox-reports-files:/opt/netbox/netbox/reports
      - netbox-scripts-files:/opt/netbox/netbox/scripts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 90s

  netbox-worker:
    image: netboxcommunity/netbox:v4.4-3.4.1
    depends_on:
      netbox:
        condition: service_healthy
    environment:
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    volumes:
      - netbox-media-files:/opt/netbox/netbox/media
      - netbox-reports-files:/opt/netbox/netbox/reports
      - netbox-scripts-files:/opt/netbox/netbox/scripts
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q rqworker || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  netbox-media-files:
  netbox-postgres-data:
  netbox-redis-cache-data:
  netbox-redis-data:
  netbox-reports-files:
  netbox-scripts-files:
